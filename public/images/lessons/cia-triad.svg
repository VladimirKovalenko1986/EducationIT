<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <radialGradient id="glowA" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="10%" cy="95%" r="60%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="640" rx="36" fill="#0b1a2e"/>
  <rect width="800" height="640" rx="36" fill="url(#glowA)"/>
  <rect width="800" height="640" rx="36" fill="url(#glowB)"/>

  <!-- Трикутник -->
  <polygon points="400,170 190,480 610,480" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="400,170 190,480 610,480" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 10" transform="translate(400 377) scale(0.78) translate(-400 -377)"/>

  <!-- Центр: інформація -->
  <circle cx="400" cy="377" r="74" fill="#13233a" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M384 352h32v10h-32zM384 370h32M384 382h24M384 394h28" stroke="#c9d6e8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="400" y="430" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="2" fill="#c9d6e8">ІНФОРМАЦІЯ</text>

  <!-- C: конфіденційність -->
  <circle cx="400" cy="170" r="56" fill="url(#teal)"/>
  <rect x="384" y="166" width="32" height="26" rx="5" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M390 166v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="400" y="74" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Конфіденційність</text>
  <text x="400" y="100" text-anchor="middle" font-size="18" font-weight="600" fill="#5eead4">Confidentiality</text>

  <!-- I: цілісність -->
  <circle cx="610" cy="480" r="56" fill="url(#blue)"/>
  <path d="M592 482l12 12 24-26" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="610" y="580" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Цілісність</text>
  <text x="610" y="606" text-anchor="middle" font-size="18" font-weight="600" fill="#93c5fd">Integrity</text>

  <!-- A: доступність -->
  <circle cx="190" cy="480" r="56" fill="url(#violet)"/>
  <path d="M190 456v22" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M176 464a20 20 0 1 0 28 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="190" y="580" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Доступність</text>
  <text x="190" y="606" text-anchor="middle" font-size="18" font-weight="600" fill="#c4b5fd">Availability</text>
</svg>
